<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f"><title>IRIS Admin | لوحة الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
.admin-shell{max-width:1200px;margin:30px auto;padding:0 18px}.admin-head,.admin-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.admin-head h1{margin:5px 0}.admin-grid{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:22px}.admin-nav,.admin-main,.login-box{background:rgba(12,27,45,.94);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:18px}.admin-nav{display:flex;flex-direction:column;gap:8px;height:max-content}.admin-nav button,.admin-action{background:transparent;border:1px solid rgba(255,255,255,.1);color:inherit;padding:11px 13px;border-radius:10px;text-align:right;cursor:pointer;font:inherit}.admin-nav button.active,.admin-action.primary{background:#13b8a6;color:#06131d;border-color:#13b8a6;font-weight:800}.admin-main{min-height:480px}.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.metric{padding:18px;border-radius:14px;background:#10243a;border:1px solid rgba(255,255,255,.07)}.metric b{display:block;font:700 28px Orbitron;color:#27d6c3}.metric span{color:#b8c7d8}.admin-table-wrap{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:600px}th,td{padding:12px;border-bottom:1px solid rgba(255,255,255,.09);text-align:right;vertical-align:middle}th{color:#65d9cd}.admin-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.admin-form label{display:flex;flex-direction:column;gap:6px;color:#c9d7e6}.admin-form input,.admin-form select,.admin-form textarea,.login-box input{background:#081727;border:1px solid #29445e;color:white;border-radius:9px;padding:11px;font:inherit;width:100%;box-sizing:border-box}.admin-form textarea{min-height:90px}.admin-form .wide{grid-column:1/-1}.admin-login{max-width:420px;margin:70px auto;padding:0 16px}.admin-login .login-box{display:grid;gap:12px}.admin-login h1{margin:0}.admin-error{color:#ff8b8b;min-height:24px}.pill{display:inline-block;padding:3px 9px;border-radius:99px;background:#183a4b;color:#8fe7dc;font-size:12px}.row-actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:12px;color:#9fb2c7}.hidden{display:none!important}
@media(max-width:760px){.admin-grid{grid-template-columns:1fr}.admin-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.admin-form{grid-template-columns:1fr}.admin-form .wide{grid-column:auto}}

/* IRIS tournament admin refresh */
.brand-mark{border-radius:50%;background:linear-gradient(145deg,#ffe6a0,#b77b22);border:2px solid #f8d98b;box-shadow:0 0 0 5px #e7b94f18,0 10px 30px #0007;color:#172235}
.brand-mark svg{width:30px;height:30px}
.admin-shell{max-width:1380px;margin:24px auto 44px}
.admin-head{padding:24px 26px;border:1px solid #e7b94f38;border-radius:22px;background:linear-gradient(115deg,#152b42,#0d1b2b 65%,#192d40);box-shadow:0 18px 55px #0005}
.admin-head h1{font-size:clamp(25px,4vw,36px);letter-spacing:-.5px}
.admin-grid{grid-template-columns:245px minmax(0,1fr);gap:20px;margin-top:20px}
.admin-nav{position:sticky;top:14px;border-color:#e7b94f28;background:linear-gradient(180deg,#12243a,#0b1928)}
.admin-nav button{transition:.2s;border-color:transparent;border-right:3px solid transparent}
.admin-nav button:hover,.admin-nav button.active{border-color:#e7b94f45;border-right-color:var(--gold);background:linear-gradient(90deg,#e7b94f12,#31c8c108);color:var(--gold2)}
.admin-main{border-color:#e7b94f24;background:linear-gradient(145deg,#122238f5,#0b1928f5);border-radius:20px;padding:24px}
.admin-main h2{font-size:23px;margin:0 0 8px;color:#ffe2a0}
.admin-main h3{color:#e7c77e}
.metric{border-color:#e7b94f22;background:linear-gradient(145deg,#162e47,#0c1b2c);position:relative;overflow:hidden}
.metric:after{content:"";position:absolute;width:75px;height:75px;border:1px solid #e7b94f20;border-radius:50%;left:-20px;bottom:-34px}
.metric b{color:#f2cc76}
.admin-form{padding:18px;border:1px solid #e7b94f25;border-radius:16px;background:#09182780}
.admin-form input:focus,.admin-form select:focus,.admin-form textarea:focus{border-color:#d8ad50;box-shadow:0 0 0 3px #d8ad5018}
.admin-action.primary{background:linear-gradient(110deg,#b98428,#ffe09a);border-color:#e7b94f;color:#152033}
.admin-table-wrap{border:1px solid #e7b94f20;border-radius:14px}
table{min-width:760px}th{background:#162a40;color:#f2d58f;position:sticky;top:0}tr:hover td{background:#ffffff06}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.count-chip{border:1px solid #e7b94f55;border-radius:99px;padding:7px 13px;color:#f2d58f;background:#e7b94f12;font-size:12px}
.search-label{display:block;margin:20px 0 10px;color:#e7c77e;font-weight:700;font-size:12px}
.search-label input{margin-top:7px}
@media(max-width:760px){.admin-grid{grid-template-columns:1fr}.admin-nav{position:static}.admin-main{padding:16px}.admin-head{padding:18px}.admin-shell{margin-top:14px}}
</style></head>

<main class="admin-shell">

<div class="admin-grid"><nav class="admin-nav" id="adminNav">

</nav><section class="admin-main"><div id="adminContent">جارٍ التحميل...</div></section></div>
</section></main><footer><b>IRIS FAMILY</b><span>Admin Control Center · Since 2024</span></footer>
